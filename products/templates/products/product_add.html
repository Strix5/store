{% extends 'products/base.html' %}
<!--{% load humanize %}-->

{% block content %}
    <section>
<!--    <div class="alert alert-warning text-center" role="alert">-->
<!--        Пожалуйста, заполните адрес электронной почты.-->
<!--    </div>-->
    <div class="container">
        <br>
        <div class="py-5 text-center">
            <h1>Добавление товара</h1>
        </div>
        <div class="row g-5">
            <div class="col-md-7 col-lg-8">
                <h4 class="mb-3">Информация о продукте</h4>
                <form action="{% url 'products:products_add' %}" method='POST'>
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-12 mt-3">
                            <label for="{{ form.name.id_for_label }}" class="form-label">Название продукта</label>
                            {{ form.name }}
                        </div>

                        <div class="col-12 mt-3">
                            <label for="{{ form.description.id_for_label }}" class="form-label">Описание</label>
                            {{ form.description }}
                        </div>

                        <div class="col-sm-6">
                            <label for="{{ form.price.id_for_label }}" class="form-label">Цена</label>
                            {{ form.price }}
                        </div>

                        <div class="col-sm-6">
                            <label for="{{ form.quantity.id_for_label }}" class="form-label">Количество</label>
                            {{ form.quantity }}
                        </div>

                        <div class="col-12 mt-3">
                            <label for="{{ form.image.id_for_label }}" class="form-label">Фото</label>
                            {{ form.image }}
                        </div>

                        <div class="col-12 mt-3">
                            <label for="{{ form.category.id_for_label }}" class="form-label">Категория</label>
                            {{ form.category }}
                        </div>

                    </div>
                    <hr class="my-4">

                    <button class="w-100 btn btn-primary btn-lg" type="submit">Продолжить</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
